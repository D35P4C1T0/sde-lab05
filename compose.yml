services:
    app:
        image: ghcr.io/d35p4c1t0/sde-lab05/app:latest
        container_name: github-action-app
        ports:
        - "5001:5001"
        networks:
        - github-action-network
        secrets:
            - my_secret
        volumes:
            - ./json/data.json:/app/json/data.json:rw

networks:
    github-action-network:
        driver: bridge

secrets:
    my_secret:
        file: .env
